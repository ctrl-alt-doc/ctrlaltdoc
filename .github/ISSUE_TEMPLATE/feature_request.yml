name: Feature request
description: Propose a focused improvement to ctrl alt doc.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests should describe a real documentation problem and a testable outcome. Please search existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and who experiences it?
      placeholder: As a documentation author, I need ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the author-facing experience and the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing CAD feature, workaround, or approach did you consider?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that would show the feature is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and scope
      description: Explain possible effects on existing Markdown, configuration, SSR, builds, search, or generated projects.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add mockups, examples, links, or related issues if useful.
