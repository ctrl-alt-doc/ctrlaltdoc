name: Publish packages to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test and publish changed package versions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test packages
        run: |
          pnpm --filter ctrl-alt-doc test
          pnpm --filter create-ctrlaltdoc build

      - name: Publish new package versions
        shell: bash
        run: |
          set -euo pipefail

          for package_directory in packages/ctrl-alt-doc packages/create-ctrlaltdoc; do
            package_name=$(node -p "require('./${package_directory}/package.json').name")
            local_version=$(node -p "require('./${package_directory}/package.json').version")
            published_version=$(npm view "${package_name}" version 2>/dev/null || true)

            if [[ "${local_version}" == "${published_version}" ]]; then
              echo "${package_name}@${local_version} is already published; skipping."
              continue
            fi

            echo "Publishing ${package_name}@${local_version}."
            npm publish --access public "./${package_directory}"
          done
